name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g cordova
      - run: |
          cordova create app com.investmentpro.app "InvestmentPro"
          cd app
          rm -rf www
          cp -r $GITHUB_WORKSPACE/www www
          cp $GITHUB_WORKSPACE/config.xml .
          cordova platform add android@13.0.0
          cordova build android --debug
          cd ..
          find app -name "*.apk" -exec cp {} ./InvestmentPro.apk \;
          ls -la InvestmentPro.apk
      - uses: actions/upload-artifact@v4
        with:
          name: InvestmentPro-APK
          path: InvestmentPro.apk
