name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build APK
        run: |
          npm install -g cordova
          cordova create app com.investmentpro.app "InvestmentPro"
          cd app
          rm -rf www
          cp -r ../www www
          cp ../config.xml .
          cordova platform add android
          cordova build android --debug
          echo "=== LIST APK FILES ==="
          find . -name "*.apk"
          echo "=== COPY APK ==="
          find . -name "*.apk" -exec cp {} ../InvestmentPro.apk \; -exec echo "Copied: {}" \;
          echo "=== VERIFY ==="
          ls -la ../InvestmentPro.apk
      - uses: actions/upload-artifact@v4
        with:
          name: InvestmentPro-APK
          path: InvestmentPro.apk
