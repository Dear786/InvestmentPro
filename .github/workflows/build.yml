name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          npm install -g cordova
          cordova create app com.investmentpro.app "InvestmentPro"
          cd app
          rm -rf www
          cp -r ../www www
          cp ../config.xml .
          cordova platform add android
          cordova build android --debug
          cp platforms/android/app/build/outputs/apk/debug/app-debug.apk ../InvestmentPro.apk
          ls -la ../InvestmentPro.apk
      - uses: actions/upload-artifact@v4
        with:
          name: APK
          path: InvestmentPro.apk
